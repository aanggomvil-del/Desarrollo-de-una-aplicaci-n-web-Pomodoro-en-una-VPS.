<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera página HTML</title>
</head>
<body>
  <header>
    <h1>Hola, mundo</h1>
    <p>Este es un ejemplo básico de estructura HTML.</p>
  </header>

  <main>
    <section>
      <h2>Elementos comunes</h2>
      <ul>
        <li>Encabezados y párrafos</li>
        <li>Listas ordenadas o desordenadas</li>
        <li><a href="https://developer.mozilla.org/es/" target="_blank" rel="noopener">Enlace a MDN Web Docs</a></li>
      </ul>
    </section>

    <section>
      <h2>Contacto</h2>
      <form action="#" method="post">
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" required>
        <button type="submit">Enviar</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Ejemplo HTML</p>
  </footer>
</body>
</html>
